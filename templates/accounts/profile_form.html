{% extends "base.html" %}

{% block title %}Редагування профілю | DR TOISTER{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-7">
            <section class="auth-card">
                <div class="auth-eyebrow">Особистий кабінет</div>

                <h1 class="auth-title">Редагування профілю</h1>

                <form method="post" novalidate>
                    {% csrf_token %}

                    {% include "includes/form_fields.html" %}

                    <div class="d-flex flex-wrap gap-2">
                        <button class="btn btn-dark" type="submit">
                            Зберегти
                        </button>

                        <a
                                class="btn btn-outline-secondary"
                                href="{% url 'accounts:dashboard' %}"
                        >
                            Скасувати
                        </a>
                    </div>
                </form>
            </section>
        </div>
    </div>
{% endblock %}
