{% extends "base.html" %}

{% block title %}
    Реєстрація | DR TOISTER
{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h1 class="mb-4">Створення облікового запису</h1>

            <p class="text-secondary">
                Косметологи отримають професійний доступ після
                підтвердження доктором.
            </p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <button class="btn btn-dark w-100" type="submit">
                    Зареєструватися
                </button>
            </form>

            <p class="mt-4">
                Уже маєте обліковий запис?

                <a href="{% url 'accounts:login' %}">
                    Увійти
                </a>
            </p>
        </div>
    </div>
{% endblock %}
