<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
    >
    <title>
        {% block title %}DR TOISTER{% endblock %}
    </title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>

<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            DR TOISTER
        </a>

        <div class="d-flex align-items-center gap-3">
            {% if user.is_authenticated %}
                <a
                        class="nav-link"
                        href="{% url 'accounts:dashboard' %}"
                >
                    Кабінет
                </a>

                <a
                        class="nav-link"
                        href="{% url 'accounts:profile-update' %}"
                >
                    Профіль
                </a>

                <form
                        method="post"
                        action="{% url 'accounts:logout' %}"
                >
                    {% csrf_token %}
                    <button
                            class="btn btn-outline-dark"
                            type="submit"
                    >
                        Вийти
                    </button>
                </form>
            {% else %}
                <a
                        class="btn btn-outline-dark"
                        href="{% url 'accounts:login' %}"
                >
                    Увійти
                </a>

                <a
                        class="btn btn-dark"
                        href="{% url 'accounts:register' %}"
                >
                    Реєстрація
                </a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-5">
    {% if messages %}
        {% for message in messages %}
            <div
                    class="alert alert-{{ message.tags|default:'info' }}"
                    role="alert"
            >
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>
</body>
</html>
